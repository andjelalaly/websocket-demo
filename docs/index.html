 <div>
    <input type="range" id="controllTD" class="slider"/><br>

    <input type="range" id="controllTD2" class="slider"/>
</div>
    <div id="buttonDiv">
    <button type="button" id="button1" class="buttonprimary">Click</button>
    </div>
    <div>
    <form class="form-inline">
        <section class="form-group">
          <label for="msgForm"><h2>Message：</h2></label> 
          <input type="text" class="message-input" id="msgForm">
        </section>
    </form>
    </div>
    
  <script>
    //var host = location.hostname;
    //console.log("Host : ", host);
    //var ws = new WebSocket('ws://' + host + ':8080');
    var ws = new WebSocket('wss://websocket-server-x2bm.onrender.com');

    var controlTD = document.getElementById("controllTD");
    var controlTD2 = document.getElementById("controllTD2");

    controlTD.addEventListener('input', (event) => {
      //console.log(controlTD.value);
    ws.send(JSON.stringify({'slider2':controlTD.value, 'slider3':controlTD2.value}))
      
    });
      
    controlTD2.addEventListener('input', (event) => {
    //console.log(controlTD.value);
    ws.send(JSON.stringify({'slider2':controlTD.value, 'slider3':controlTD2.value}))
    });

    var container = document.getElementById("buttonDiv");
    var buttonCount = 1;
    var  buttonState = {"button1" : 1 };
    //var buttonState = { "button0": 0 };
    
    function addButton(currentButton, currentId){
      currentButton.addEventListener('click', (event) => {
       buttonState[currentId] = 1; 
       buttonCount++;
       var newId =`button${buttonCount}`;
       
       var newButton = document.createElement('button');
       newButton.innerText ="Again";
       newButton.style.position ='absolute';

       var maxX = (window.innerWidth - (currentButton.offsetWidth || 50));
       var maxY = (window.innerHeight - (currentButton.offsetHeight || 50 ));

       var randomX = Math.floor(Math.random()* maxX)
       var randomY = Math.floor(Math.random()* maxY)

       newButton.style.left = `${randomX}px`;
       newButton.style.top = `${randomY}px`;;

       container.appendChild(newButton);
       
       currentButton.disabled=true;
       addButton(newButton, newId);
       
       buttonState[newId] = 0;
       
        ws.send(JSON.stringify(buttonState)) 
      });
    }
    var buttonTD = document.getElementById("button1");
    buttonTD.style.position = 'absolute';
    addButton(buttonTD, "button1")

    
    
    $("form").submit(function(e){
      var message = $("#msgForm").val();
      $("#msgForm").val('');
      ws.send(message);
      e.preventDefault();
    });
