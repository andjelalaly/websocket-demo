   slider.addEventListener('input', (e) => {

});

 slider3.addEventListener('input', (e) => {

    ws.onopen = function(){
      var resetState= { "button1": 0 };
      ws.send(JSON.stringify(resetState));

    });

    });

    var buttonCount = 1;
    var buttonState = {"button1" : 0 };
    var createdButtons = [];
    var createClearButton = false;
    //var buttonState = { "button0": 0 };
    
    function addButton(currentButton, currentId){
      currentButton.addEventListener('click', (event) => {
       buttonState[currentId] = 1; 
       buttonCount++;
       var newId =`button${buttonCount}`;

       var newButton = document.createElement('button');
       newButton.innerText ="again";
       newButton.style.position ='absolute';
       newButton.style.mixBlendMode ='difference';
       function getRandomColor(){
       return "#" + ((1 << 24) * Math.random() | 0).toString(16).padStart(6, "0");
      }
       const initialcolor = getRandomColor();
       newButton.style.backgroundColor = initialcolor;
       newButton.style.setProperty('--flicker-color', initialcolor);

       //setTimeout(buttonFlicker, 3000)
       
       
       var maxX = (window.innerWidth - (currentButton.offsetWidth || 50));
       var maxY = (window.innerHeight - (currentButton.offsetHeight || 50 ));
       
       var randomX = Math.floor(Math.random()* Math.max(maxX-30))
       var randomY = Math.floor(Math.random()* Math.max(maxY-30))
       
       newButton.style.left = `${randomX}px`;
       newButton.style.top = `${randomY}px`;;
       
       container.appendChild(newButton);
       createdButtons.push(newButton);
       
       if(buttonCount >=9){
         if(slider) {
           slider.style.position ='absolute';
           slider.style.left = '10px'
           slider.style.top = '290px'
           slider.value ='10'
           slider.style.setProperty('--value',10)
           slider2.value ='90'
           slider2.style.setProperty('--value',90)
           ws.send(JSON.stringify({'slider1':controlTD.value, 'slider2':controlTD2.value, 'slider3':controlTD3.value, 'slider4':controlTD4.value, 'slider5':controlTD5.value}));
          } 
          
             newButton.classList.add('flickering-button');
             newButton.style.backgroundColor = getRandomColor()
          
             setInterval(() => {
             newButton.style.backgroundColor = getRandomColor();},1000);
             newButton.style.setProperty('flicker-color',getRandomColor())
          
      }

      if (buttonCount >= 15){
        const existingSlider2 = document.getElementById("controllTD2");
        if(existingSlider2) {
          existingSlider2.style.position ='absolute';
          existingSlider2.style.right = '50px'
          existingSlider2.style.top = '600px'
          slider.value ='50'
          slider.style.setProperty('--value',50)
          slider2.value ='30'
          slider2.style.setProperty('--value',30)
          ws.send(JSON.stringify({'slider1':controlTD.value, 'slider2':controlTD2.value, 'slider3':controlTD3.value, 'slider4':controlTD4.value, 'slider5':controlTD5.value}));
        }
      }
       
       if (buttonCount >= 20){
        const existingSlider3 = document.getElementById("controllTD3");
        if(existingSlider3) {
          existingSlider3.style.position ='absolute';
          existingSlider3.style.right = '50px'
          existingSlider3.style.top = '100px'
          ws.send(JSON.stringify({'slider1':controlTD.value, 'slider2':controlTD2.value, 'slider3':controlTD3.value, 'slider4':controlTD4.value, 'slider5':controlTD5.value}));
        }
      }


       if (buttonCount >= 24){
        const existingSlider4 = document.getElementById("controllTD4");
        if(existingSlider4) {
          existingSlider4.style.position ='absolute';
          existingSlider4.style.left = '50px'
          existingSlider4.style.bottom = '100px'
           ws.send(JSON.stringify({'slider1':controlTD.value, 'slider2':controlTD2.value, 'slider3':controlTD3.value, 'slider4':controlTD4.value, 'slider5':controlTD5.value}));
  
        }
      }


       if (!createClearButton){
        var clearButton= document.createElement('button');
        clearButton.innerText="clear"
        clearButton.style.position ='absolute';
        clearButton.style.mixBlendMode ='difference';
        clearButton.style.marginTop = '3.5cm'; 

        clearButton.addEventListener('click',() =>{
          createdButtons.forEach(btn=> btn.remove());
          createdButtons =[];
          
          
          var firstButton = document.getElementById("button1");
          if (firstButton) firstButton.disabled = false;
          
          clearButton.remove();
          createClearButton = false;
          
          buttonState = {"button1": 0};
          buttonCount = 1
          ws.send(JSON.stringify(buttonState));
          
          const movedSlider = document.getElementById("controllTD");
          const movedSlider2 = document.getElementById("controllTD2");
          const movedSlider3 = document.getElementById("controllTD3");
          
          if(movedSlider){
            movedSlider.style.position ='static'
            movedSlider.value ='30'
            movedSlider.style.setProperty('--value',30)
            slider2.value ='15'
            slider2.style.setProperty('--value',15)
            slider3.value= '0'
            slider3.style.setProperty('--value',0)
            slider4.value= '0'
            slider4.style.setProperty('--value',0)
            slider5.value= '0'
            slider5.style.setProperty('--value',0)
            
            ws.send(JSON.stringify({'slider1': 30, 'slider2':15, 'slider3':0, 'slider4':0, 'slider5': 0}));
        
          }

          if(movedSlider2){
            movedSlider2.style.position ='static'
            movedSlider.value ='30'
            movedSlider.style.setProperty('--value',30)
            slider2.style.setProperty('--value',15)
            slider3.value= '0'
            slider3.style.setProperty('--value',0)
            slider4.value= '0'
            slider4.style.setProperty('--value',0)
            slider5.value= '0'
            slider5.style.setProperty('--value',0)
            
            ws.send(JSON.stringify({'slider1': 30, 'slider2':15, 'slider3':0, 'slider4':0, 'slider5': 0}));
           
        
          }

          if(movedSlider3){
            movedSlider3.style.position ='static'
             movedSlider.value ='30'
            movedSlider.style.setProperty('--value',30)
            slider2.style.setProperty('--value',15)
            slider3.value= '0'
            slider3.style.setProperty('--value',0)
            slider4.value= '0'
            slider4.style.setProperty('--value',0)
            slider5.value= '0'
            slider5.style.setProperty('--value',0)
          }
          
        });
        container.appendChild(clearButton);
        createClearButton = true;
        
       }
       
       currentButton.disabled=true; 
       addButton(newButton, newId);
       
       buttonState[newId] = 0;
       
        ws.send(JSON.stringify(buttonState)) 
      });
    }
    var buttonTD = document.getElementById("button1");
    buttonTD.style.position = 'absolute';
    buttonTD.style.backgroundColor = "#" + ((1 << 24) * Math.random() | 0).toString(16).padStart(6, "0")
    addButton(buttonTD, "button1")

    
    
    $("form").submit(function(e){
      var message = $("#msgForm").val();
      $("#msgForm").val('');
      ws.send(message);
      e.preventDefault();
    });
